function dlg(html,cls=''){closeDlg();const m=document.createElement('div');m.className='mv dg';m.innerHTML=`<div class="md fm ${cls}">${html}</div>`;m.onclick=e=>{if(e.target==m)closeDlg()};document.body.append(m);return m}
function form(t,fs,ok,cb,note=''){const m=dlg(`<form><h2>${t}</h2>${note?`<p class="mu">${note}</p>`:''}${fs.map(f=>f[3]?`<label>${f[1]}<select id="d_${f[0]}">${f[3].map(o=>`<option ${o==f[2]?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`:`<label>${f[1]}<input id="d_${f[0]}" ${f[2]||''}></label>`).join('')}<p class="err" id="de"></p><div class="acts"><button type="button" class="btn o" data-n="close">Cancelar</button><button class="btn">${ok}</button></div></form>`);
 m.querySelector('form').onsubmit=async e=>{e.preventDefault();const er=await cb(Object.fromEntries(fs.map(f=>{const x=$('#d_'+f[0]);return[f[0],x.type=='checkbox'?x.checked:x.value.trim()]})));if(er)$('#de').textContent=er;else closeDlg()};m.querySelector('input')?.focus()}
function payDlg(){const tot=tot$(),rec=c2(PAGOS.reduce((a,p)=>a+p.v,0)),rest=Math.max(c2(tot-rec),0),troco=Math.max(c2(rec-tot),0);
 const m=dlg(`<h2>Pagamento</h2><div class="tot"><small>TOTAL DA VENDA</small><strong>${R(tot)}</strong></div><label>Valor nesta forma de pagamento (R$)<input id="pv" inputmode="decimal" value="${fmt(rest)}"></label><div class="pay">${['Dinheiro','PIX','Débito','Crédito','Vale','Transferência'].map(x=>`<button type="button" data-n="addpay" data-v="${x}">${x}</button>`).join('')}</div>${PAGOS.map((p,i)=>`<div class="sm"><span>${p.m}</span><span>${R(p.v)} <button class="ib" aria-label="Remover pagamento" data-n="rmpay" data-i="${i}">${I.trash}</button></span></div>`).join('')}<div class="sm"><span>Recebido</span><b>${R(rec)}</b></div><div class="sm"><span>Restante</span><b>${R(rest)}</b></div><div class="sm"><span>Troco</span><b>${R(troco)}</b></div><p class="err" id="de"></p><div class="acts"><button class="btn o" data-n="close">Voltar</button><button class="btn" data-n="finish" ${rest>0.004?'disabled':''}>Finalizar venda</button></div>`);$('#pv')?.select()}
function addPay(m){const rec=c2(PAGOS.reduce((a,p)=>a+p.v,0)),rest=Math.max(c2(tot$()-rec),0),x=c2(nu($('#pv').value)),er=s=>($('#de').textContent=s);
 if(rest<=0.004)return er('O total já está coberto. Finalize a venda.');if(!(x>0))return er('Informe um valor maior que zero');
 if(m!='Dinheiro'&&x>rest+0.004)return er('Este meio de pagamento não pode exceder o restante ('+R(rest)+')');PAGOS.push({m,v:Math.round(x*100)/100});payDlg()}
const rcText=L=>[EMP.fant,'CNPJ '+EMP.cnpj,'MATRIZ · CAIXA 02',L.quando||new Date().toLocaleString('pt-BR'),'Venda #'+L.id+' · '+L.cli,'--------------------------------',...L.itens.map(x=>`${x.n.slice(0,16).padEnd(16)} ${x.q.padStart(8)} ${fmt(x.s).padStart(7)}`),'--------------------------------','Subtotal'.padEnd(20)+fmt(L.sub).padStart(12),'Desconto'.padEnd(20)+fmt(L.desc).padStart(12),'TOTAL'.padEnd(20)+fmt(L.tot).padStart(12),...L.pag.map(p=>p.m.padEnd(20)+fmt(p.v).padStart(12)),'Troco'.padEnd(20)+fmt(L.troco).padStart(12),'',L.fiscal].join('\n');
function finish(){const sub=total(),tot=tot$(),rec=c2(PAGOS.reduce((a,p)=>a+p.v,0));if(!cart.length||Math.round(rec*100)<Math.round(tot*100))return;
 const troco=Math.max(c2(rec-tot),0),id=++SID;PAGOS.forEach(p=>{CX.por[p.m]=c2((CX.por[p.m]||0)+p.v)});if(troco)CX.por.Dinheiro=c2((CX.por.Dinheiro||0)-troco);CX.n++;if(!net)pend++;
 LAST={id,cli:CLI,sub,desc:DESC,tot,pag:PAGOS.slice(),troco,quando:new Date().toLocaleString('pt-BR'),fiscal:net?'NFC-e autorizada (protocolo simulado)':'NFC-e em CONTINGÊNCIA · envio pendente',itens:cart.map(([i,q])=>({n:CAT[i][1],q:i==3?kg(q)+'kg':String(q),s:lt(i,q)}))};
 cart=[];DESC=0;CLI='Consumidor final';PAGOS=[];show('pdv');dlg(`<h2>Venda #${id} finalizada</h2><pre class="rc">${esc(rcText(LAST))}</pre><div class="acts"><button class="btn o" data-n="print">Imprimir</button><button class="btn" data-n="close">Nova venda</button></div>`)}
function act(a){const sub=total();
 if(a=='abrir')return form('Abertura de caixa',[['v','Valor inicial (R$)','inputmode="decimal" value="100,00"']],'Abrir caixa',v=>{const x=c2(nu(v.v));if(!(x>=0))return 'Informe o valor inicial';CX={aberto:true,ini:x,sang:0,supr:0,n:0,por:{}};show('pdv')},'Operador: '+(ME?ME.n:'')+' · '+new Date().toLocaleString('pt-BR'));
 if(!CX.aberto)return toast('Abra o caixa primeiro');
 if(a=='pagar'){if(!cart.length)return toast('Adicione itens antes de pagar');PAGOS=[];return payDlg()}
 if(a=='cliente')return form('Cliente',[['c','Nome ou CPF (opcional)']],'Confirmar',v=>{CLI=v.c||'Consumidor final';show('pdv')});
 if(a=='desconto'){if(!cart.length)return toast('Adicione itens antes de aplicar desconto');return form('Desconto',[['v','Valor (R$) ou percentual (ex.: 10%)']],'Aplicar',v=>{const x=v.v.endsWith('%')?sub*nu(v.v)/100:nu(v.v);if(!(x>=0)||x>sub)return 'Desconto inválido (de zero até o subtotal)';DESC=Math.round(x*100)/100;show('pdv')},'Subtotal: '+R(sub))}
 if(a=='suspender'){if(!cart.length)return toast('Não há venda para suspender');SUSP.push({cart,DESC,CLI});cart=[];DESC=0;CLI='Consumidor final';show('pdv');return toast('Venda suspensa. Use "Recuperar venda" para retomá-la')}
 if(a=='recuperar'){if(cart.length)return toast('Finalize ou suspenda a venda atual primeiro');const s=SUSP.pop();if(!s)return;({cart,DESC,CLI}=s);return show('pdv')}
 if(a=='cancelar'){if(!cart.length)return toast('Não há venda em andamento');return form('Cancelar venda',[],'Cancelar venda',()=>{cart=[];DESC=0;show('pdv');toast('Venda cancelada e registrada na auditoria')},'Todos os itens serão removidos desta venda.')}
 if(a=='consultar')return form('Consultar produto',[['q','Código de barras ou nome']],'Consultar',v=>{const r=CAT.filter(c=>c[0]==v.q||(v.q&&c[1].toLowerCase().includes(v.q.toLowerCase())));if(!r.length)return 'Nenhum produto encontrado';toast(r.map(c=>`${c[1]} · ${R(c[2])}`).join('  |  '))});
 if(a=='reimprimir')return LAST?printText(rcText(LAST)):toast('Nenhuma venda para reimprimir');
 if(a=='sangria'||a=='suprimento'){const s=a=='sangria';return form(s?'Sangria':'Suprimento',[['v','Valor (R$)','inputmode="decimal"'],['m','Motivo']],'Registrar',v=>{const x=c2(nu(v.v));if(!(x>0))return 'Informe o valor';if(s&&x>caixaDin())return 'Valor maior que o dinheiro em caixa';if(v.m.length<3)return 'Informe o motivo';if(s)CX.sang=c2(CX.sang+x);else CX.supr=c2(CX.supr+x);toast(`${s?'Sangria':'Suprimento'} de ${R(x)} registrado`);show('pdv')},'Dinheiro em caixa: '+R(caixaDin()))}
 if(a=='fechar'){if(cart.length)return toast('Finalize ou cancele a venda atual antes de fechar o caixa');return form('Fechamento de caixa',[['v','Dinheiro contado (R$)','inputmode="decimal"']],'Fechar caixa',v=>{const x=c2(nu(v.v));if(!(x>=0))return 'Informe o valor contado';const esp=caixaDin(),d=Math.round((x-esp)*100)/100;if(d)occ('E301',`Fechamento: esperado ${R(esp)} · contado ${R(x)} (${d<0?'falta':'sobra'} ${R(Math.abs(d))})`);CX={aberto:false,ini:0,sang:0,supr:0,n:0,por:{}};show('pdv');toast(d?`Caixa fechado com ${d<0?'falta':'sobra'} de ${R(Math.abs(d))}. Ocorrência E301 aberta para o técnico`:'Caixa fechado sem diferença')},`Esperado em dinheiro: ${R(caixaDin())} · Vendas: ${Object.entries(CX.por).map(([k,x])=>k+' '+R(x)).join(' · ')||'—'}`)}}
function notFound(code){dlg(`<h2>PRODUTO NÃO ENCONTRADO</h2><p class="mu">Código: <b>${code}</b></p><div class="acts"><button class="btn o" data-n="close">Cancelar</button><button class="btn o" data-n="search">Pesquisar manualmente</button><button class="btn" data-n="quick" data-v="${code}">Cadastrar produto</button></div>`)}
function quick(code){form('Cadastro rápido',[['n','Nome do produto'],['p','Preço de venda (R$)','inputmode="decimal"']],'Cadastrar e adicionar',v=>{const p=nu(v.p);if(v.n.length<3)return 'Informe o nome';if(!(p>0))return 'Preço inválido';
 CAT.push([code,v.n,p,'NOVO-'+code.slice(-4)]);const o=OC.find(x=>x.cod=='E101'&&x.code==code&&x.status=='Aberta');if(o){o.status='Corrigida';o.fix={code:'C01',v:[v.n,String(p)],just:'Cadastro rápido no PDV pelo operador',em:hh(),por:ME.n};navRender()}addItem(CAT.length-1);show('pdv')},'Código '+code)}
function toggleNet(){net=!net;clearInterval(syIv);SY=null;if(net&&pend>0)return startSync();toast(net?'Internet restabelecida':'Modo offline: o PDV continua vendendo e salva no terminal');show(cur)}
function startSync(){SY={p:0};syIv=setInterval(()=>{SY.p+=20;if(SY.p>=100){clearInterval(syIv);SY=null;pend=0;toast('✓ Tudo sincronizado')}show(cur)},350);show(cur)}

const pdvSave=()=>{try{localStorage.setItem(PDVK,JSON.stringify({CX,cart,DESC,CLI,SUSP,LAST,SID,net,pend}))}catch{}};
function pdvLoad(){try{const s=JSON.parse(localStorage.getItem(PDVK)||'null');if(!s)return;if(s.CX)CX=s.CX;cart=(s.cart||[]).filter(x=>x&&CAT[x[0]]);DESC=s.DESC||0;CLI=s.CLI||CLI;SUSP=s.SUSP||[];LAST=s.LAST||null;SID=s.SID||SID;net=s.net!==false;pend=s.pend||0}catch{}}
function printText(txt){document.getElementById('printArea')?.remove();const a=document.createElement('div');a.id='printArea';a.innerHTML=`<div class="pg"><pre class="dn tm" style="width:302px">${esc(txt)}</pre></div>`;document.body.append(a);
 let s=document.getElementById('printStyle');if(!s){s=document.createElement('style');s.id='printStyle';document.head.append(s)}s.textContent='@page{size:80mm 297mm;margin:3mm}';
 const done=()=>{a.remove();window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);try{window.print()}catch{a.remove();toast('A impressão foi bloqueada neste ambiente')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-n="ordAcc"]');if(!b||!NEWORD)return;const r=T.delivery.rows.find(x=>x[0]==NEWORD.id);if(r&&r[4]=='Novo')r[4]='Em preparo';NEWORD=null;show('delivery')});
window.addEventListener&&window.addEventListener('error',e=>toast('Erro inesperado: '+((e&&e.message)||'veja o console do navegador')));window.addEventListener&&window.addEventListener('unhandledrejection',e=>toast('Erro inesperado: '+((e&&e.reason&&e.reason.message)||'falha em uma operação')));
async function boot(){show();await initStore();const s=await loadSnap();applySnap(s);PARTS.forEach(p=>{if(s[p])STORE.last[p]=JSON.stringify(snap()[p])});syncMG();pdvLoad();READY=true;const u=readSess();if(u){ME=u;applyNav();show(canSee(cur)?cur:undefined)}else show()}
boot();
</script>
